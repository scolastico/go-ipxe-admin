# --- Localization & Regional Settings ---
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i time/zone string Europe/Berlin
d-i clock-setup/utc boolean true

# --- Network & Mirror ---
# This prevents the installer from asking which mirror to use
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Account Security (Root Only, No Password) ---
d-i passwd/make-user boolean false
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password !

# --- Disk Partitioning (Destructive!) ---
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Package Installation ---
d-i pkgsel/include string openssh-server
d-i pkgsel/upgrade select safe-upgrade

# --- Bootloader ---
# Install GRUB automatically to the MBR/EFI path
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# --- SSH Key Injection & Config ---
# Fixed the missing backslash and added PasswordAuth cleanup
d-i preseed/late_command string \
    in-target mkdir -p /root/.ssh; \
    echo "ssh-rsa " > /target/root/.ssh/authorized_keys; \
    in-target chmod 700 /root/.ssh; \
    in-target chmod 600 /root/.ssh/authorized_keys; \
    in-target sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config; \
    in-target sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config; \
    in-target sed -i 's/^#\?KbdInteractiveAuthentication.*/KbdInteractiveAuthentication no/' /etc/ssh/sshd_config; \
    in-target sed -i 's/^#\?ChallengeResponseAuthentication.*/ChallengeResponseAuthentication no/' /etc/ssh/sshd_config

# --- Finish Installation ---
d-i finish-install/reboot_tnx boolean true